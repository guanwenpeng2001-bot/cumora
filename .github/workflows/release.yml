name: Release

# Fires when a `v*` tag is pushed (or manually via workflow_dispatch).
# Optional dispatch to this repository. Enable only after installing a
# repository_dispatch release receiver; this workflow does not build packages.
#
# The GKE backend roll-out is deliberately NOT tied to this tag: deploy.yml
# is `workflow_dispatch` only, so a desktop release never mutates production.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0 — no v prefix)'
        required: true
        type: string

jobs:
  trigger-release:
    if: vars.CUMORA_ENABLE_RELEASE_DISPATCH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            REF="${{ github.ref_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
            REF="v${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "Triggering release for version: $VERSION (ref: $REF)"

      - name: Trigger release receiver in this repository
        uses: peter-evans/repository-dispatch@v3
        with:
          # Same-repository dispatch can use the workflow token.
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          event-type: release
          client-payload: '{"ref": "${{ steps.version.outputs.ref }}", "version": "${{ steps.version.outputs.version }}"}'

      - name: Output status
        run: |
          echo "Successfully dispatched release event to ${{ github.repository }}"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Ref: ${{ steps.version.outputs.ref }}"
          echo ""
          echo "Watch the build at: https://github.com/${{ github.repository }}/actions"
