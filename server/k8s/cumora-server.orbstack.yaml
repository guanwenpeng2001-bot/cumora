# cumora-server — single-replica OrbStack / local-dev manifest with uploads PVC.
# Local uploads MUST NOT scale to multiple replicas or nodes. Recreate avoids
# overlapping writers during updates (brief downtime). No HPA for this variant.
# Requires a default StorageClass with persistent single-node storage; back up
# the uploads PVC with PostgreSQL. For HA/multiple nodes migrate uploads to R2
# and use the GKE template; changing replicas alone is unsupported.
#
# For production GKE, use `cumora-server.gke.yaml` instead; that one
# has the Cloud SQL Proxy sidecar, Workload Identity annotation,
# Artifact Registry images, and PodDisruptionBudget that prod needs.
#
# Apply order (Secret first, manifests next):
#
#   kubectl create secret generic cumora \
#     --from-literal=DATABASE_URL='postgres://USER:PASS@host.docker.internal:5432/cumora' \
#     --from-literal=REDIS_URL='redis://host.docker.internal:6379' \
#     --from-literal=OPENAI_API_KEY='sk-...' \
#     --from-literal=AGENT_RUNTIME_SECRET="$(openssl rand -hex 32)"
#
#   export CUMORA_NAMESPACE=default # set to the server ServiceAccount namespace
#   # Create the namespace and required Secrets in that namespace first.
#   node scripts/render-k8s.mjs orbstack | kubectl apply -f -
# This is a template: render CUMORA_NAMESPACE before applying. Using kubectl -n
# alone cannot rewrite the cluster-scoped binding's ServiceAccount subject.
# FUSE device plugin is required; see server/k8s/generic-device-plugin.note.
#
# OrbStack-isms baked in here:
#   - PG/Redis URLs in the Secret use host.docker.internal
#   - No imagePullSecrets (OrbStack auto-loads images from local docker)
#   - No Cloud SQL Proxy sidecar
#   - No Workload Identity annotation
---
# ServiceAccount + Role + RoleBinding — the orchestrator shells out
# to `kubectl get / apply / delete pod`. Inside the pod, kubectl
# uses the projected SA token automatically; we just have to grant
# the SA those verbs on `pods` (and `pods/log` so the orchestrator
# can fetch pod output during diagnostics).
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: ${CUMORA_NAMESPACE}
  name: cumora-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ${CUMORA_NAMESPACE}
  name: cumora-server-agent-pods
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
# Chrome-profile PVC lifecycle: apply/read plus off-board and idle cleanup.
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Nodes are cluster-scoped, so the FUSE monitoring probe needs a narrow
# ClusterRole in addition to the namespaced Pod Role above.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cumora-server-node-read
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cumora-server-node-read
subjects:
- kind: ServiceAccount
  name: cumora-server
  namespace: ${CUMORA_NAMESPACE}
roleRef:
  kind: ClusterRole
  name: cumora-server-node-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: ${CUMORA_NAMESPACE}
  name: cumora-server-agent-pods
subjects:
- kind: ServiceAccount
  name: cumora-server
roleRef:
  kind: Role
  name: cumora-server-agent-pods
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: ${CUMORA_NAMESPACE}
  name: cumora-uploads
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
# Deployment — run `npm run migrate` once before applying this manifest.
# Application replicas only verify the immutable migration ledger and never
# execute DDL while starting.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ${CUMORA_NAMESPACE}
  name: cumora-server
  labels: { app: cumora-server }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: cumora-server }
  template:
    metadata:
      labels: { app: cumora-server }
    spec:
      serviceAccountName: cumora-server
      volumes:
      - name: uploads
        persistentVolumeClaim: { claimName: cumora-uploads }
      containers:
      - name: server
        image: quay.io/yetoneful/cumora-server:dev
        imagePullPolicy: IfNotPresent
        ports:
        - { name: http, containerPort: 5181 }
        volumeMounts:
        - { name: uploads, mountPath: /app/server/uploads }
        envFrom:
        - secretRef: { name: cumora }
        env:
        # storage-precheck accepts local mode; omit all R2 keys from the Secret
        # to use this volume. Complete R2 configuration still selects R2.
        - name: CUMORA_REQUIRE_R2
          value: "false"
        # The agent-computer pod reaches the server via this URL.
        # When server runs IN the cluster, use the service DNS;
        # when server runs on the host, agents reach it via
        # host.docker.internal (configure explicitly for host services).
        - name: AGENT_RUNTIME_SERVER_URL
          value: "http://cumora-server.${CUMORA_NAMESPACE}.svc.cluster.local:5181/runtime"
        - name: CUMORA_AGENT_NAMESPACE
          value: "${CUMORA_NAMESPACE}"
        # In-cluster PG is also reachable via the service URL above
        # for the agent FUSE driver's HTTP traffic; PG itself lives
        # on the host in dev (host.docker.internal:5432, set in the
        # Secret's DATABASE_URL).
        # Startup waits for the schema gate's bounded DB retry budget. Liveness
        # only checks the process; readiness checks PG/Redis reachability and keeps a
        # booting or degraded pod out of service without killing it.
        startupProbe:
          httpGet: { path: /api/livez, port: http }
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet: { path: /api/health, port: http }
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet: { path: /api/livez, port: http }
          periodSeconds: 30
          timeoutSeconds: 3
        resources:
          requests: { cpu: "100m", memory: "256Mi" }
          limits:   { cpu: "1000m", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  namespace: ${CUMORA_NAMESPACE}
  name: cumora-server
  labels: { app: cumora-server }
spec:
  selector: { app: cumora-server }
  ports:
  - { name: http, port: 5181, targetPort: http }
