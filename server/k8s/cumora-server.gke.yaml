# cumora-server — production GKE manifest.
#
# Differs from cumora-server.orbstack.yaml in five places:
#   1. Cloud SQL Proxy sidecar — server connects to PG via 127.0.0.1:5432;
#      the proxy tunnels to Cloud SQL using Workload Identity.
#   2. ServiceAccount has the Workload Identity annotation (binds the
#      K8s SA to a GCP IAM service account).
#   3. Artifact Registry images — pulled using the GKE node service account.
#   4. PodDisruptionBudget — rolling updates / node maintenance can't
#      take all replicas down at once.
#   5. Slightly bigger resource requests / limits.
#
# Before applying, do the GCP-side setup once (see server/k8s/gke.md):
#   - Create the GCP service account `cumora-server@<project>.iam.gserviceaccount.com`
#   - Grant it `roles/cloudsql.client` on the project (and the Cloud SQL
#     instance's password-IAM-auth bindings if you use IAM database auth)
#   - Bind the K8s SA `cumora-server` → that GCP SA via Workload Identity
#   - Create the `cumora` Secret with DATABASE_URL etc. (DATABASE_URL
#     should point at 127.0.0.1:5432 — the proxy sidecar listens there)
#   - Grant the GKE node service account roles/artifactregistry.reader.
#
# Apply:
#   export CUMORA_NAMESPACE=default # set to the server ServiceAccount namespace
#   # Create the namespace and required Secrets in that namespace first.
#   node scripts/render-k8s.mjs gke > "$TMPDIR/cumora-gke.yaml"
#   kubectl apply --dry-run=client -f "$TMPDIR/cumora-gke.yaml" -o yaml
#   kubectl apply -f "$TMPDIR/cumora-gke.yaml"
# This is a template: render all variables with scripts/render-k8s.mjs. kubectl -n
# alone cannot rewrite the cluster-scoped binding's ServiceAccount subject.
# FUSE device plugin is required; see server/k8s/generic-device-plugin.note.
---
# ServiceAccount with Workload Identity annotation binding to the
# GCP IAM service account that holds Cloud SQL Client (and any
# other GCP API permissions cumora's tools need).
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: ${CUMORA_NAMESPACE}
  name: cumora-server
  annotations:
    # REPLACE: project-id + service-account email
    iam.gke.io/gcp-service-account: cumora-server@${GCP_PROJECT}.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ${CUMORA_NAMESPACE}
  name: cumora-server-agent-pods
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
# Per-agent chrome-profile PVC. The orchestrator applies one PVC per
# agent (idempotent — same name across pod respawns) so Chromium's
# login state / cookies survive an idle-exit. Without these verbs
# the apply silently fails with "forbidden", the pod manifest then
# references a PVC that doesn't exist, and the pod hangs Pending
# with "persistentvolumeclaim not found" — the failure mode that
# took prod down on the first OpenCLI rollout. Same scope as pods:
# read for sanity, write for create/update; delete for the
# off-board cleanup path (deleteChromeProfilePvc).
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Nodes are cluster-scoped, so the FUSE monitoring probe needs a narrow
# ClusterRole in addition to the namespaced Pod/PVC Role above.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cumora-server-node-read
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cumora-server-node-read
subjects:
- kind: ServiceAccount
  name: cumora-server
  namespace: ${CUMORA_NAMESPACE}
roleRef:
  kind: ClusterRole
  name: cumora-server-node-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: ${CUMORA_NAMESPACE}
  name: cumora-server-agent-pods
subjects:
- kind: ServiceAccount
  name: cumora-server
roleRef:
  kind: Role
  name: cumora-server-agent-pods
  apiGroup: rbac.authorization.k8s.io
---
# Deployment — 2 replicas by default. Database migrations are owned by one
# pre-deploy Job; application replicas only verify schema compatibility.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ${CUMORA_NAMESPACE}
  name: cumora-server
  labels: { app: cumora-server }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: cumora-server }
  template:
    metadata:
      labels: { app: cumora-server }
    spec:
      serviceAccountName: cumora-server
      # GKE node service account needs Artifact Registry Reader; no pull secret.
      containers:
      # Cloud SQL Proxy sidecar — exposes Cloud SQL on 127.0.0.1:5432.
      # Authentication via Workload Identity, no SA key file needed.
      # See https://cloud.google.com/sql/docs/postgres/connect-auth-proxy
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.0
        args:
          - "--structured-logs"
          - "--port=5432"
          - "--health-check"          # exposes a /readiness HTTP probe on :9090
          - "--http-port=9090"
          - "--http-address=0.0.0.0"
          # REPLACE with your Cloud SQL instance connection name:
          # <project>:<region>:<instance>
          - "${SQL_CONNECTION_NAME}"
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        ports:
        - { name: pg, containerPort: 5432 }
        - { name: pg-health, containerPort: 9090 }
        readinessProbe:
          httpGet: { path: /readiness, port: pg-health }
        resources:
          requests: { cpu: "50m",  memory: "64Mi" }
          limits:   { cpu: "500m", memory: "256Mi" }
      - name: server
        image: ${AR_REGION}-docker.pkg.dev/${GCP_PROJECT}/${AR_REPO}/server:${IMAGE_TAG}
        imagePullPolicy: IfNotPresent
        ports:
        - { name: http, containerPort: 5181 }
        envFrom:
        - secretRef: { name: cumora }
        env:
        # Shared storage is mandatory; empty values also fail at server startup.
        - name: CUMORA_REQUIRE_R2
          value: "true"
        - name: R2_ENDPOINT
          valueFrom:
            secretKeyRef: { name: cumora, key: R2_ENDPOINT, optional: false }
        - name: R2_BUCKET
          valueFrom:
            secretKeyRef: { name: cumora, key: R2_BUCKET, optional: false }
        - name: R2_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef: { name: cumora, key: R2_ACCESS_KEY_ID, optional: false }
        - name: R2_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef: { name: cumora, key: R2_SECRET_ACCESS_KEY, optional: false }
        # Agent pods reach the server via cluster-internal DNS.
        # CUMORA_NAMESPACE also sets the server ServiceAccount binding.
        - name: AGENT_RUNTIME_SERVER_URL
          value: "http://cumora-server.${CUMORA_NAMESPACE}.svc.cluster.local:5181/runtime"
        # Where agent-computer pods land. Recommended: a dedicated
        # namespace (`cumora-agents`) with its own RBAC scope. Make
        # sure the Role above is bound in THAT namespace too.
        - name: CUMORA_AGENT_NAMESPACE
          value: "${CUMORA_NAMESPACE}"
        # Image for agent-computer pods. Must be pushed to a registry
        # reachable from the cluster (and pull-secret-able if private).
        - name: CUMORA_AGENT_COMPUTER_IMAGE
          value: "${AR_REGION}-docker.pkg.dev/${GCP_PROJECT}/${AR_REPO}/agent-computer:${IMAGE_TAG}"
        # Pull secrets the orchestrator attaches to each agent Pod
        # spec. Comma-separated. Must exist in CUMORA_AGENT_NAMESPACE.
        - name: CUMORA_AGENT_PULL_SECRETS
          value: ""
        # Optional: pin agent pods to a specific node pool / GKE
        # Workload Identity SA via CUMORA_AGENT_SERVICE_ACCOUNT
        # (defaults to namespace `default` SA when unset).
        # Startup waits for the schema gate's bounded DB retry budget. Liveness
        # only checks the process; readiness checks PG/Redis reachability and keeps a
        # booting or degraded pod out of service without killing it.
        startupProbe:
          httpGet: { path: /api/livez, port: http }
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet: { path: /api/health, port: http }
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet: { path: /api/livez, port: http }
          periodSeconds: 30
          timeoutSeconds: 3
        resources:
          requests: { cpu: "250m", memory: "512Mi" }
          limits:   { cpu: "2000m", memory: "2Gi" }
---
apiVersion: v1
kind: Service
metadata:
  namespace: ${CUMORA_NAMESPACE}
  name: cumora-server
  labels: { app: cumora-server }
spec:
  selector: { app: cumora-server }
  ports:
  - { name: http, port: 5181, targetPort: http }
---
# PodDisruptionBudget — protects against voluntary disruptions
# (rolling updates, node drains) taking the API down. With
# replicas: 2 and minAvailable: 1, at least one replica is always
# serving during a rollout.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  namespace: ${CUMORA_NAMESPACE}
  name: cumora-server
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: cumora-server }
