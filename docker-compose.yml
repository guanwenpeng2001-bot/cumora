name: cumora

# One-command self-hosted stack:
#   db     — Postgres 16 + pgvector (reuses the existing cumora-pgdata volume)
#   redis  — Redis 7 (reuses the existing cumora-redis-data volume)
#   server — API + scheduler + orchestrator (built from server/docker/cumora-server.Dockerfile)
#   web    — static SPA bundle served by nginx, reverse-proxying /api, /ws, /uploads
#
# Prerequisites:
#   - .env at the repo root (gitignored) with the usual keys
#   - ~/.kube/config-docker: a copy of ~/.kube/config whose server is rewritten
#     to https://host.docker.internal:58705 with tls-server-name: kubernetes
#     (the apiserver cert has no SAN for host.docker.internal; tls-server-name
#     keeps full CA verification). See deploy/README.md.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cumora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: cumora
      POSTGRES_DB: cumora
    volumes:
      - cumora-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cumora"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7
    container_name: cumora-redis
    restart: unless-stopped
    volumes:
      - cumora-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build:
      context: .
      dockerfile: server/docker/cumora-server.Dockerfile
    container_name: cumora-server
    restart: unless-stopped
    env_file: .env
    environment:
      # .env carries localhost URLs for host-run dev; inside compose the
      # datastores are reached by service name. `environment` wins over env_file.
      DATABASE_URL: postgres://postgres:cumora@db:5432/cumora
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    # The image CMD only starts the server — chain the migration runner in
    # front so the schema is guaranteed current before boot (advisory-locked,
    # idempotent).
    command: ["sh", "-c", "npm run migrate && npm run server:start"]
    volumes:
      # Container-reachable kubeconfig copy (see header). Read-only mount;
      # kubectl in the container runs as root and auto-detects this path.
      - ${USERPROFILE}/.kube/config-docker:/root/.kube/config:ro
    ports:
      - "5181:5181"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5181/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    container_name: cumora-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_started

  # sub2api — LLM quota gateway. cumora-server mirrors each user into it
  # (see server/src/sub2api.ts) and routes tenant LLM traffic through it.
  # Built from our fork, which adds POST /api/v1/admin/users/:id/api-keys
  # (admin-side key minting; upstream only has the user-facing POST /keys).
  sub2api:
    build:
      context: https://github.com/guanwenpeng2001-bot/sub2api.git#main
    container_name: cumora-sub2api
    restart: unless-stopped
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      # Own database inside the shared pg16 instance (created once by hand:
      # CREATE DATABASE sub2api). pg_trgm is available in the pgvector image.
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: cumora
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      # Shared redis, separate logical db (cumora uses db 0).
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "1"
      ADMIN_EMAIL: admin@cumora.local
      # Interpolated from the repo-root .env (compose's own substitution,
      # NOT env_file) — all three must be set there.
      ADMIN_PASSWORD: ${SUB2API_ADMIN_PASSWORD:?set SUB2API_ADMIN_PASSWORD in .env}
      JWT_SECRET: ${SUB2API_JWT_SECRET:?set SUB2API_JWT_SECRET in .env}
      TOTP_ENCRYPTION_KEY: ${SUB2API_TOTP_ENCRYPTION_KEY:?set SUB2API_TOTP_ENCRYPTION_KEY in .env}
      TZ: Asia/Shanghai
    volumes:
      - sub2api-data:/app/data
    # The host's fake-ip VPN DNS intermittently returns no A record for
    # aliyuncs.com (only unroutable-in-container AAAA), killing DashScope
    # calls with "network is unreachable". Pin public resolvers; Docker's
    # embedded DNS still handles service names / host.docker.internal and
    # forwards everything else here.
    dns:
      - 223.5.5.5
      - 119.29.29.29
    # Custom dns above makes the embedded resolver stop answering
    # host.docker.internal (NXDOMAIN) — pin it via hosts entry instead.
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      # 8082 avoids clashing with Vite dev (5180), server (5181), web (8080).
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  # Pre-existing data — external so `compose down` never touches them.
  cumora-pgdata:
    external: true
  cumora-redis-data:
    external: true
  sub2api-data:
