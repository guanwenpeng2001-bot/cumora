name: cumora

# Base self-hosted stack; add docker-compose.gateway.yml explicitly for sub2api:
#   db     — Postgres 16 + pgvector (reuses the existing cumora-pgdata volume)
#   redis  — Redis 7 (reuses the existing cumora-redis-data volume)
#   server — API + scheduler + orchestrator (built from server/docker/cumora-server.Dockerfile)
#   web    — static SPA bundle served by nginx, reverse-proxying /api, /ws, /uploads
#
# Prerequisites:
#   - .env at the repo root (gitignored) with the usual keys
#   - ~/.kube/config-docker: a copy of ~/.kube/config whose server is rewritten
#     to a container-reachable API endpoint with tls-server-name: kubernetes
#     (the apiserver cert has no SAN for host.docker.internal; tls-server-name
#     keeps full CA verification). See deploy/README.md.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cumora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cumora
    volumes:
      - cumora-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cumora"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7
    container_name: cumora-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["/bin/sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - cumora-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build:
      context: .
      dockerfile: server/docker/cumora-server.Dockerfile
    container_name: cumora-server
    restart: unless-stopped
    env_file: .env
    environment:
      # .env carries localhost URLs for host-run dev; inside compose the
      # datastores are reached by service name. `environment` wins over env_file.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/cumora
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      NODE_ENV: production
    # The schema is owned by the one-shot `migrate` service below. Keeping
    # DDL out of this long-lived container avoids a migration failure turning
    # into a server CrashLoopBackOff.
    volumes:
      # Must match storage.ts UPLOAD_DIR under image WORKDIR /app.
      - cumora-uploads:/app/server/uploads
      # Container-reachable kubeconfig copy (see header). Read-only mount;
      # kubectl in the container runs as root and auto-detects this path.
      - ${KUBECONFIG_DOCKER:-${USERPROFILE:-${HOME}}/.kube/config-docker}:/root/.kube/config:ro
    ports:
      - "5181:5181"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5181/api/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Match the k8s startupProbe budget (~300s). Schema verification retries
      # with exponential backoff plus bounded connection timeouts can exceed
      # the previous 30s grace window even though migrate already finished.
      start_period: 300s

  # Run schema migrations exactly once before the API starts. Compose waits
  # for this service to exit successfully through server.depends_on.
  migrate:
    build:
      context: .
      dockerfile: server/docker/cumora-server.Dockerfile
    container_name: cumora-migrate
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/cumora
      NODE_ENV: production
    command: ["npm", "run", "migrate"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    container_name: cumora-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_started


volumes:
  cumora-uploads:
    name: cumora-uploads
  # Pre-existing data — external so `compose down` never touches them.
  cumora-pgdata:
    external: true
  cumora-redis-data:
    external: true
