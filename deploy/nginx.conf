# cumora-web nginx vhost: serve the built SPA and reverse-proxy the API,
# the realtime WebSocket, and locally-stored attachments to the server
# container.
#
# Requires nginx >= 1.27.3: shared upstream DNS refresh and idle connection
# pooling work together, including after server container replacement.
upstream cumora_api {
    zone cumora_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server server:5181 resolve;
    keepalive 64;
    keepalive_timeout 4s;
    keepalive_requests 1000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=5s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # JSON API → server container
    location /api/ {
        client_max_body_size 40m;
        proxy_pass http://cumora_api;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Daemon runtime HTTP and wake-stream SSE. Preserve /runtime/ and queries.
    location /runtime/ {
        client_max_body_size 40m;
        proxy_pass http://cumora_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Realtime WebSocket (/ws) → server container. Requires HTTP/1.1 +
    # Upgrade headers; long read/send timeouts so idle sockets aren't cut.
    location /ws {
        proxy_pass http://cumora_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Locally-stored attachments are served by the server container
    location /uploads/ {
        proxy_pass http://cumora_api;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 40m;
    }

    # SPA fallback — every other GET renders index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
