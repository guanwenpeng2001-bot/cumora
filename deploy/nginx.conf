# cumora-web nginx vhost: serve the built SPA and reverse-proxy the API,
# the realtime WebSocket, and locally-stored attachments to the server
# container.
#
# The proxy targets use Docker's embedded DNS resolver (127.0.0.11) via a
# variable, so the upstream is re-resolved per request — a recreated server
# container with a fresh IP does not require an nginx reload (a static
# proxy_pass would pin the startup-time resolution forever).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=5s;

    # JSON API → server container
    location /api/ {
        client_max_body_size 40m;
        set $upstream http://server:5181;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Realtime WebSocket (/ws) → server container. Requires HTTP/1.1 +
    # Upgrade headers; long read/send timeouts so idle sockets aren't cut.
    location /ws {
        set $upstream http://server:5181;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Locally-stored attachments are served by the server container
    location /uploads/ {
        set $upstream http://server:5181;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 40m;
    }

    # SPA fallback — every other GET renders index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
